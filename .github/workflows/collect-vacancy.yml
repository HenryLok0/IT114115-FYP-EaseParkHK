name: Collect open data

on:
  schedule:
    # Every 15 minutes UTC. GitHub may delay scheduled jobs during load.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-open-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect, forecast, publish Pages JSON
        run: python scripts/run_pipeline.py

      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --staged --quiet; then
            echo "No dataset changes"
            exit 0
          fi
          git commit -m "chore(data): open-data snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
